# The community page, in order (row 1: scholarship, two wide, and trees; then the fundraisers). Optional `art` (an include) or `media` sits on top; `media` works as on
# projects ({image|video, poster, alt, caption}). No stock photos: only Arpit's own or ones sent to him.
# `stats` show as figures on the card (personal numbers are fine here; never Amazon work figures).
# No amounts raised on fundraisers. Card text without "I"; link labels without "the".
- id: ajbrs
  wide: true   # two columns wide
  art: ajbrs-papers.html   # the moving panel on top of the card, from _data/ajbrs_papers.yml
  kind: Scholarship
  since: "yearly since 2022"
  title: Arpit Jain Best Researcher Scholarship
  summary: >-
    An award each year for the best research published by students in the ICT department at
    Manipal Institute of Technology, my alma mater.
  # From the scholarship site's past recipients and publications pages (2023–2025 cohorts).
  stats:
    - {value: "13", label: scholars}
    - {value: "10", label: papers}
  links:
    - {label: scholarship site, url: "https://arpitjain2811.github.io/AJBRS-Website/"}
    - {label: past recipients, url: "https://arpitjain2811.github.io/AJBRS-Website/past_recipients/"}
    - {label: publications, url: "https://arpitjain2811.github.io/AJBRS-Website/publications/"}
