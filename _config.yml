# arpit-jain.com, built by GitHub Pages (Jekyll). See README.md.
title: Arpit Jain
tagline: Engineering manager at AWS
description: >-
  Arpit Jain is an engineering manager at AWS, working on Amazon Quick. At home he's teaching a
  robotic arm to pick up dice.
author: Arpit Jain
url: "https://arpit-jain.com"
baseurl: ""
lang: en

github_username: arpitjain2811

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: /:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Content model (see README.md): themes in _data/themes.yml; a project or a post names one theme.
# A post may name a `project`; a project lists its posts. Either can exist without the other.
collections:
  projects:
    output: true
    permalink: /projects/:name/
  # Boiler Room: a newsletter series under writings, one file per edition (see scripts/boiler_room/RUNBOOK.md)
  boiler_room:
    output: true
    permalink: /writings/boiler-room/:name/

defaults:
  - scope: {path: ""}
    values: {image: /assets/img/og-card.jpg}
  - scope: {path: "", type: posts}
    values: {layout: post}
  - scope: {path: "", type: projects}
    values: {layout: project}
  - scope: {path: "", type: boiler_room}
    values: {layout: boiler-edition}

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - scripts/
  - scholarship-logos/
  - scholarship-mock/
  - arpit-jain.com.zone
